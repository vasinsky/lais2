<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#101524" />
      <stop offset="100%" stop-color="#090c13" />
    </linearGradient>

    <radialGradient id="glow-left" cx="20%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-right" cx="80%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-center" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>

    <linearGradient id="fav-sphere" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="80%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="fav-inner-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.3)" />
    </linearGradient>

    <linearGradient id="diamond-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0.7" />
    </linearGradient>

    <filter id="badge-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#8b5cf6" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="v-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)" />
  <rect width="1200" height="500" fill="url(#grid)" />
  <rect width="1200" height="500" fill="url(#glow-left)" />
  <rect width="1200" height="500" fill="url(#glow-right)" />
  <rect width="1200" height="500" fill="url(#glow-center)" />

  <text x="600" y="65" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" fill="#ffffff" letter-spacing="3">LOCAL AI STUDIO</text>
  <text x="600" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="16" fill="#94a3b8" letter-spacing="0.5">Autonomous Coding Assistant &amp; ComfyUI Visual Pipeline</text>

  <!-- Left: Code Editor Card -->
  <g transform="translate(80, 140)">
    <rect width="320" height="230" rx="14" fill="#161b26" stroke="rgba(59, 130, 246, 0.35)" stroke-width="1.5" />
    <circle cx="22" cy="18" r="5" fill="#ef4444" />
    <circle cx="38" cy="18" r="5" fill="#f59e0b" />
    <circle cx="54" cy="18" r="5" fill="#10b981" />
    <rect x="22" y="44" width="140" height="9" rx="4" fill="#60a5fa" opacity="0.9" />
    <rect x="22" y="68" width="220" height="9" rx="4" fill="#94a3b8" opacity="0.7" />
    <rect x="38" y="92" width="180" height="9" rx="4" fill="#c084fc" opacity="0.9" />
    <rect x="38" y="116" width="130" height="9" rx="4" fill="#34d399" opacity="0.9" />
    <rect x="38" y="140" width="195" height="9" rx="4" fill="#f472b6" opacity="0.8" />
    <rect x="22" y="164" width="110" height="9" rx="4" fill="#94a3b8" opacity="0.6" />
    <rect x="22" y="192" width="250" height="10" rx="5" fill="#3b82f6" opacity="0.8" />
  </g>

  <!-- Right: Node Workflow Card -->
  <g transform="translate(800, 140)">
    <rect width="320" height="230" rx="14" fill="#161b26" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.5" />
    <rect x="20" y="35" width="110" height="60" rx="8" fill="#202538" stroke="#8b5cf6" stroke-width="1.2" />
    <rect x="185" y="65" width="115" height="75" rx="8" fill="#202538" stroke="#ec4899" stroke-width="1.2" />
    <rect x="30" y="135" width="115" height="65" rx="8" fill="#202538" stroke="#3b82f6" stroke-width="1.2" />
    <path d="M 130 65 C 155 65, 160 100, 185 100" fill="none" stroke="#a855f7" stroke-width="2.5" />
    <path d="M 145 165 C 165 165, 165 125, 185 125" fill="none" stroke="#ec4899" stroke-width="2.5" />
    <circle cx="130" cy="65" r="4" fill="#ffffff" />
    <circle cx="185" cy="100" r="4" fill="#ffffff" />
    <circle cx="145" cy="165" r="4" fill="#ffffff" />
    <circle cx="185" cy="125" r="4" fill="#ffffff" />
  </g>

  <!-- Center: Favicon Badge -->
  <g transform="translate(600, 255)">
    <circle cx="0" cy="0" r="92" fill="#0d111a" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2" />

    <g filter="url(#badge-shadow)">
      <circle cx="0" cy="0" r="82" fill="url(#fav-sphere)" />
      <circle cx="0" cy="0" r="79.5" fill="none" stroke="url(#fav-inner-shadow)" stroke-width="2.5" />
      <circle cx="0" cy="0" r="78" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
    </g>

    <g filter="url(#v-glow)">
      <polygon points="0,-16 16,10 0,26 -16,10" fill="rgba(224, 231, 255, 0.35)" />
      <polygon points="0,-12 11,8 0,21 -11,8" fill="url(#diamond-glow)" />

      <line x1="-38" y1="-32" x2="0" y2="40" stroke="#f8fafc" stroke-width="14" stroke-linecap="round" />
      <line x1="38" y1="-32" x2="0" y2="40" stroke="#f8fafc" stroke-width="14" stroke-linecap="round" />

      <circle cx="-38" cy="-32" r="10" fill="#ffffff" />
      <circle cx="38" cy="-32" r="10" fill="#ffffff" />
      <circle cx="0" cy="40" r="10" fill="#ffffff" />

      <line x1="-38" y1="-32" x2="0" y2="40" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" opacity="0.6" />
      <line x1="38" y1="-32" x2="0" y2="40" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    </g>
  </g>

  <!-- Bottom Pills -->
  <g transform="translate(600, 435)">
    <g transform="translate(-290, 0)">
      <rect x="0" y="0" width="105" height="30" rx="15" fill="#181d2a" stroke="#334155" stroke-width="1" />
      <text x="52.5" y="20" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#cbd5e1">FastAPI</text>
    </g>
    <g transform="translate(-170, 0)">
      <rect x="0" y="0" width="115" height="30" rx="15" fill="#181d2a" stroke="#334155" stroke-width="1" />
      <text x="57.5" y="20" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#cbd5e1">React + Vite</text>
    </g>
    <g transform="translate(-40, 0)">
      <rect x="0" y="0" width="105" height="30" rx="15" fill="#181d2a" stroke="#334155" stroke-width="1" />
      <text x="52.5" y="20" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#cbd5e1">Ollama LLM</text>
    </g>
    <g transform="translate(80, 0)">
      <rect x="0" y="0" width="100" height="30" rx="15" fill="#181d2a" stroke="#334155" stroke-width="1" />
      <text x="50" y="20" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#cbd5e1">ComfyUI</text>
    </g>
    <g transform="translate(195, 0)">
      <rect x="0" y="0" width="135" height="30" rx="15" fill="#181d2a" stroke="#334155" stroke-width="1" />
      <text x="67.5" y="20" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#cbd5e1">Docker Compose</text>
    </g>
  </g>
</svg>
