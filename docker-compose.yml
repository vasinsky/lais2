services:
  mongo:
    image: mongo:7.0
    container_name: studio_mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db

  mcp-server:
    build: ./mcp-server
    container_name: studio_mcp
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      - PROJECTS_ROOT_DIR=/projects
    volumes:
      - ${PROJECTS_DIR:-./projects}:/projects
      - ./mcp-server/server.py:/app/server.py

  backend:
    build: ./backend
    container_name: studio_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:8000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - COMFY_URL=${COMFY_URL}
      - OLLAMA_URL=${OLLAMA_URL}
      - TRANSLATOR_MODEL=${TRANSLATOR_MODEL:-dolphin-llama3:latest}
      - VISION_MODEL=${VISION_MODEL:-minicpm-v:latest}
      - DEFAULT_CODER_MODEL=${DEFAULT_CODER_MODEL:-qwen2.5-coder:7b-instruct-q4_K_M}
      - HTTP_PROXY=socks5://host.docker.internal:10808
      - HTTPS_PROXY=socks5://host.docker.internal:10808
      - ALL_PROXY=socks5://host.docker.internal:10808
      - NO_PROXY=127.0.0.1,localhost,host.docker.internal,mongo
      - PROJECTS_ROOT_DIR=/app/projects
      - COMFYUI_CHECKPOINTS_DIR=/app/comfy_checkpoints
      - COMFYUI_DEFAULT_CHECKPOINT=${COMFYUI_DEFAULT_CHECKPOINT:-Realistic_Vision_V6.0_NV_B1_fp16.safetensors}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend:/app
      - ${PROJECTS_DIR:-./projects}:/app/projects
      - ./generated_images:/app/generated_images
    depends_on:
      - mongo
    command: /app/entrypoint.sh

  frontend:
    build: ./frontend
    container_name: studio_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: /app/entrypoint.sh

volumes:
  mongo_data:
