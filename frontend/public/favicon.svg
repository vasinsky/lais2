<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Яркий динамичный фон -->
    <linearGradient id="brightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Стеклянный градиент для кристалла V -->
    <linearGradient id="glassWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.65" />
    </linearGradient>

    <!-- Мягкая тень -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Круглая подложка с сочным градиентом -->
  <circle cx="32" cy="32" r="30" fill="url(#brightBg)" filter="url(#softShadow)" />

  <!-- Внутренний световой контур -->
  <circle cx="32" cy="32" r="28" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.45" />

  <!-- Кристальная буква V (VAIS) -->
  <!-- Левое крыло -->
  <path d="M16 19 L32 49 L27 49 L13 22 Z" fill="#ffffff" fill-opacity="0.9" />
  
  <!-- Правое крыло с наложением -->
  <path d="M48 19 L32 49 L37 49 L51 22 Z" fill="url(#glassWhite)" />

  <!-- Центральное гранёное ядро -->
  <polygon points="32,23 39,36 32,45 25,36" fill="#ffffff" fill-opacity="0.4" />
  <polygon points="32,27 36,36 32,42 28,36" fill="#ffffff" />

  <!-- Неоновые узлы нейросети -->
  <circle cx="15" cy="20" r="3" fill="#ffffff" />
  <circle cx="49" cy="20" r="3" fill="#ffffff" />
  <circle cx="32" cy="49" r="3.2" fill="#ffffff" />
</svg>
